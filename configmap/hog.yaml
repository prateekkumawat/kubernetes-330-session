apiVersion: apps/v1
kind: Deployment
metadata:
  name: hogs
spec:
  selector:
    matchLabels:
      app: hogs
  template:
    metadata:
      labels:
        app: hogs
    spec:
      containers:
      - name: hogsapp
        image: vish/stress
        resources: 
          requests:
            memory: "500Mi"
            cpu: "500m"
          limits: 
            memory: "1Gi"
            cpu: "1"    
        args: 
        - -cpus
        - "2"
        - -mem-total
        - "950Mi"
        - -mem-alloc-size
        - "100Mi"
        - -mem-alloc-sleep
        - "1s"