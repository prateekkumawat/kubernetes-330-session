apiVersion: apps/v1
kind: Deployment
metadata:
  name: hogs
spec:
  selector:
    matchLabels:
      app: hogs
  template:
    metadata:
      labels:
        app: hogs
    spec:
      containers:
      - name: hogsapp
        image: vish/stress
        resources: 
          requests:
            memory: "500Mi"
            cpu: "500m"
          limits: 
            memory: "1Gi"
            cpu: "1"    
        