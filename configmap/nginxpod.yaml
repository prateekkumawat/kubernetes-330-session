apiVersion: v1
kind: Namespace
metadata:
  name: data

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataapp
  namespace: data
spec:
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
    spec:
      containers:
      - name: data
        image: nginx:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        env: 
        - name: PLAYER_INITIAL_LIVES
          valueFrom:
            configMapKeyRef:
              name: keydata
              key: player_initial_lives
        - name: WEBCONF_FILE_PATH
          valueFrom:
            configMapKeyRef:
              name: keydata
              key: configmap_file
        - name: WEB_EXPOSED_PORT 
          valueFrom:
            configMapKeyRef:
              name: keydata
              key: exposed_port
        - name: WEB_PROXY_PORT
          valueFrom:
            configMapKeyRef:
              name: keydata
              key: proxy_port                 
        ports:
        - name: web
          protocol: TCP
          containerPort: 80
        - name: proxy
          protocol: TCP   
          containerPort: 82
        volumeMounts:
        - name:  nginx-config-data
          mountPath:  /etc/nginx/conf.d/
          readOnly: true
      volumes:
      - name: nginx-config-data
        configMap:
          name: nginx-config   
      
---
apiVersion: v1
kind: Service
metadata:
  name: data-svc
  namespace: data
spec:
  type: NodePort
  selector:
    app: data
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: proxy
    port: 82
    targetPort: 82
