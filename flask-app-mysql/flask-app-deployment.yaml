apiVersion: v1
kind: Namespace
metadata:
  name: flask-app

---
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: flask-app
type: Opaque
data:
  password: ZmxlY3RyYWc=
  username: YXBwdXNlcg==

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-app
spec:
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: prateekkumawat/app:flask-app-2.1.0
        resources:
          requests: 
            cpu: "200m"
            memory: "200Mi"
          limits:
            memory: "500Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        env: 
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: password
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: username
        - name: MYSQL_DATABASE_HOST
          value: mysql-service.mysql.svc.cluster.local

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  namespace: flask-app
spec:
  selector:
    app: flask-app
  type: NodePort  
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 32001
