apiVersion: v1
kind: Namespace
metadata:
  name: intial-deploy 

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-app
  namespace: intial-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        image: prateekkumawat/app:webapp-2
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: deploy-app-service
  namespace: intial-deploy
spec:
  selector:
    app: app1
  type: NodePort  
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32000