apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: support-user-role
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - daemonsets
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: support-user-role-bind
subjects:
  - kind: User
    name: support
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: support-user-role
  apiGroup: rbac.authorization.k8s.io