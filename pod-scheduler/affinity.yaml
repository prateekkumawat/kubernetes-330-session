apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-affinity
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-affinity
  template:
    metadata:
      labels:
        app: myapp-affinity
    spec:
      affinity: 
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ondemand
                operator: In
                values:
                - app
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: podlabel
                operator: In
                values:
                - master  
      containers:
      - name: myapp-affinity
        image: nginx 
        ports:
        - containerPort: 80
