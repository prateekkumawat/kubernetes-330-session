apiVersion: v1
kind: Pod
metadata:
  name: busybox1
  labels:
    app.kubernetes.io/name: busybox1
spec:
  containers:
  - name: busybox1
    image: busybox:latest
    # resources: 
    #   requests: 
    #     cpu: "100M"
    #     memory: "100Mi"
    #   limits: 
    #     cpu: "200M"
    #     memory: "200Mi"
    args: 
    - sleep 
    - "10000"
  affinity: 
     nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: ondemand
              operator: In
              values:
              - app 
            - key: topology.kubernetes.io/zone
              operator: In
              values: 
              - ap-south-1a
  tolerations: 
  - key: "ondemand"
    operator: "Equal"
    value: "app"
    effect: "NoSchedule"            

