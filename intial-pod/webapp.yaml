apiVersion: v1
kind: Namespace
metadata:
  name: webapp 

--- 
apiVersion: v1
kind: Pod
metadata:
  name: webapp
  namespace: webapp
  labels:
    app: webapp
spec:
  containers:
  - name: webapp
    image: nginx:latest
    resources:
      requests: 
        cpu: "90m"
        memory: "100Mi"
      limits:
        memory: "128Mi"
        cpu: "200m"
    ports:
      - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: webapp
spec:
  selector:
    app: webapp
  type: ClusterIP  
  ports:
  - port: 8080
    targetPort: 80
