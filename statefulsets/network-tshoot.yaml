apiVersion: v1
kind: Pod
metadata:
  name: nikolatshoot
  labels:
    app: nikolatshoot
spec:
  containers:
  - name: nikolatshoot
    restartPolicy: Always
    image: nicolaka/netshoot:latest
    resources:
      limits:
        memory: "500Mi"
        cpu: "500m"
    command:
      - sleep
      - "3600"
