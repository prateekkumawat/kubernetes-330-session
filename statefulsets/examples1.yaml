apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  ports:
  - port: 80
    name: web
  clusterIP: None
  selector:
    app: nginx
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: "nginx"
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: registry.k8s.io/nginx-slim:0.21
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: ebsstore
      resources:
        requests:
          storage: 1Gi  

---
### compersion with deployment 
apiVersion: v1
kind: Service
metadata:
  name: nginx1
  labels:
    app: nginx1
spec:
  ports:
  - port: 80
    name: web1
  clusterIP: None
  selector:
    app: nginx1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx1
  template:
    metadata:
      labels:
        app: nginx1
    spec:
      containers:
      - name: nginx
        image: registry.k8s.io/nginx-slim:0.21
        ports:
        - containerPort: 80
          name: web1
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
      volumes:
      - name:  www
        persistentVolumeClaim:
          claimName: nginx-vol1
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-11-199.ap-south-1.compute.internal    


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-vol1
spec:
  resources:
    requests:
      storage: 1Gi
  storageClassName: ebsstore
  accessModes:
    - ReadWriteOnce
