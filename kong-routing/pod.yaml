apiVersion: v1
kind: Namespace
metadata:
  name: api1-app

---
apiVersion: v1
kind: Pod
metadata:
  name: api1-app
  namespace: api1-app
  labels:
    app: api1-app
spec:
  containers:
  - name: api1-app
    image:  prateekkumawat/app:api-1.1
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: api1-app-svc
  namespace: api1-app
spec:
  selector:
    app: api1-app
  ports:
  - port: 80
    targetPort: 8000

