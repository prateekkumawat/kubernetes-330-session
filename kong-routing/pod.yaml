---
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api1-app-ingress
  namespace: api1-app
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/protocols: "https"
spec:
  ingressClassName: kong
  tls: 
   - hosts: 
      - localapp.domain2.example.com
     secretName: kong-tls
  rules:
  - host: localapp.domain2.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api1-app-svc
            port:
              number: 80