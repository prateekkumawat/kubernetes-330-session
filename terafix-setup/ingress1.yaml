apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api1-strip-prefix
  namespace: api1-app
spec:
  stripPrefix:
    prefixes:
      - /api

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api1-app-ingress
  namespace: api1-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web 
    traefik.ingress.kubernetes.io/router.middlewares: api1-app-api1-strip-prefix@kubernetescrd 
spec:
  ingressClassName: traefik
  rules:
    - host: localapp.domain1.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api1-app-svc
                port:
                  number: 80

