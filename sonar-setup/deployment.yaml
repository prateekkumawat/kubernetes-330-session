apiVersion: v1
kind: Namespace
metadata:
  name: sonar

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar-app
  namespace: sonar
spec:
  selector:
    matchLabels:
      app: sonar
  template:
    metadata:
      labels:
        app: sonar
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: sonar
        image: sonarqube:latest
        env:
        - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
          value: "true"
        resources:
          requests: 
            memory: "500Mi"
            cpu: "700m"
          limits:
            memory: "2Gi"
            cpu: "2"
        ports:
        - containerPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: sonar-svc
  namespace: sonar
spec:
  selector:
    app: sonar
  ports:
  - port: 80
    targetPort: 9000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonar-ingress
  namespace: sonar
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

spec:
  ingressClassName: traefik
  tls:
    - hosts:
      - sonar.domain2.example.com
      secretName: ingress-tls
    
  rules:
    - host: sonar.domain2.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonar-svc
                port:
                  number: 80